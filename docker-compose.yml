name: upside-leadhunter

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upside
      POSTGRES_PASSWORD: upside
      POSTGRES_DB: leadhunter
      TZ: America/Sao_Paulo
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upside -d leadhunter"]
      interval: 5s
      timeout: 3s
      retries: 20

  scraper:
    build:
      # Fonte do submodule, intacta; o Dockerfile e nosso (veja o
      # comentario no topo de docker/scraper.Dockerfile).
      context: ./vendor/mazyos-scraper
      dockerfile: ../../docker/scraper.Dockerfile
    command: ["-web", "-addr", ":8080", "-data-folder", "/data"]
    volumes:
      - scraper-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://upside:upside@db:5432/leadhunter
      SCRAPER_URL: http://scraper:8080
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/srv/app
      - ./migrations:/srv/migrations
      - ./tests:/srv/tests
      - ./pyproject.toml:/srv/pyproject.toml:ro
      - ./alembic.ini:/srv/alembic.ini:ro
      - ./.importlinter:/srv/.importlinter:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://upside:upside@db:5432/leadhunter
      SCRAPER_URL: http://scraper:8080
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./app:/srv/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  scraper-data:
