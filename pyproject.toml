[project]
name = "upside-leadhunter"
version = "0.1.0"
description = "Upside LeadHunter - prospeccao, anuncios e relatorios"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.2",
    "selectolax>=0.3.21",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "apscheduler>=3.10.4",
    "weasyprint>=63.0",
    "matplotlib>=3.9.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.389",
    "import-linter>=2.1",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.8.2",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff rules
    "ASYNC",            # async pitfalls
    "DTZ",              # naive datetimes
    "T20",              # no print
]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF001", # ambiguous unicode in pt-BR strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["I001"]
"tests/*" = ["DTZ001", "DTZ005"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = ["**/__pycache__", "vendor", "migrations/versions"]
reportMissingTypeStubs = false
reportPrivateImportUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real Postgres (testcontainers / Docker)",
]
